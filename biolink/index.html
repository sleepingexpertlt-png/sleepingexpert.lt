    position: relative;
    overflow: hidden;
  }
  .hero::after {

    height: 40px;
    background: var(--bg);

    width: 84px; height: 84px;

    position: relative;

    background: var(--card); color: var(--blue);

  .toast {

    linkedin:  { label: "LinkedIn",  svg: '<svg viewBox="0 0 24 24"><path d="M6.9 21H3.3V8.9h3.6V21zM5.1 7.3a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2zM21 21h-3.6v-5.9c0-1.4 0-3.2-2-3.2s-2.2 1.5-2.2 3.1V21H9.6V8.9h3.5v1.7h.1c.5-.9 1.7-1.9 3.4-1.9 3.7 0 4.4 2.4 4.4 5.6V21z"/></svg>' },
    pinterest: { label: "Pinterest", svg: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-3.6 19.3c-.1-.8-.2-2 0-2.9l1.2-5s-.3-.6-.3-1.5c0-1.4.8-2.4 1.8-2.4.9 0 1.3.6 1.3 1.4 0 .9-.5 2.1-.8 3.3-.2 1 .5 1.8 1.5 1.8 1.8 0 3.1-1.9 3.1-4.6 0-2.4-1.7-4-4.2-4-2.8 0-4.5 2.1-4.5 4.3 0 .9.3 1.8.7 2.3.1.1.1.2.1.3l-.3 1.1c0 .2-.1.2-.3.1-1.2-.6-2-2.4-2-3.8 0-3.1 2.3-6 6.5-6 3.4 0 6.1 2.4 6.1 5.7 0 3.4-2.1 6.1-5.1 6.1-1 0-1.9-.5-2.3-1.1l-.6 2.4c-.2.9-.8 2-1.2 2.6A10 10 0 1 0 12 2z"/></svg>' }
  };

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function isExternal(url) { try { return new URL(url, C.site).host !== siteHost; } catch (e) { return true; } }
  function attrs(url) { return isExternal(url) ? ' target="_blank" rel="noopener"' : ''; }

  // --- Socialiniai -----------------------------------------------------------
  var socialHtml = "";
  Object.keys(SOCIAL).forEach(function (k) {
    var url = C.social && C.social[k];
    if (!url) return;
    socialHtml += '<a href="' + esc(url) + '" target="_blank" rel="noopener" aria-label="' + SOCIAL[k].label + '" title="' + SOCIAL[k].label + '">' + SOCIAL[k].svg + '</a>';
  });
  var socialsEl = document.getElementById("socials");
  socialsEl.innerHTML = socialHtml;
  if (!socialHtml) socialsEl.hidden = true;

  // --- Mygtukai ----------------------------------------------------------------
  document.getElementById("links").innerHTML = (C.buttons || []).filter(function (b) { return b && b.url; }).map(function (b) {
    return '<li><a class="btn' + (b.featured ? ' featured' : '') + '" href="' + esc(track(b.url)) + '"' + attrs(b.url) + '>' +
      '<span class="ico" aria-hidden="true">' + (ICONS[b.icon] || ICONS.link) + '</span>' +
      '<span class="txt"><span class="lbl">' + esc(b.label) + '</span>' + (b.sub ? '<span class="sub">' + esc(b.sub) + '</span>' : '') + '</span>' +
      '<span class="arr" aria-hidden="true">' + ICONS.arrow + '</span></a></li>';
  }).join("");

  // --- Parduotuvės --------------------------------------------------------------
  var storesEl = document.getElementById("stores");
  var stores = (C.stores || []).filter(function (s) { return s && s.city; });
  storesEl.innerHTML = stores.map(function (s) {
    var q = encodeURIComponent("Sleeping Expert, " + s.address + ", " + s.city);
    return '<div class="store"><span class="ico" aria-hidden="true">' + ICONS.pin + '</span>' +
      '<div><div class="city">' + esc(s.city) + '</div><div class="addr">' + esc(s.address) + '</div>' +
      (s.hours ? '<div class="hrs">' + esc(s.hours) + '</div>' : '') + '</div>' +
      '<a class="map" href="https://www.google.com/maps/search/?api=1&query=' + q + '" target="_blank" rel="noopener" aria-label="' + esc(s.city) + ' žemėlapyje">Žemėlapis →</a></div>';
  }).join("");
  if (!stores.length) { storesEl.hidden = true; storesEl.previousElementSibling.hidden = true; }

  // --- Kontaktai ------------------------------------------------------------------
  var contact = "";
  if (C.phone) contact += '<a href="tel:' + esc(C.phone) + '">' + ICONS.phone + '<span>' + esc(C.phone.replace(/^\+370(\d{3})(\d{2})(\d{3})$/, "+370 $1 $2 $3")) + '</span></a>';
  if (C.email) contact += '<a href="mailto:' + esc(C.email) + '">' + ICONS.mail + '<span>' + esc(C.email) + '</span></a>';
  document.getElementById("contact").innerHTML = contact;

  // --- Poraštė / dalinimasis --------------------------------------------------------
  document.getElementById("year").textContent = new Date().getFullYear();
  document.getElementById("siteLink").href = track(C.site);

  var shareBtn = document.getElementById("shareBtn"), toast = document.getElementById("toast"), t;
  function showToast(msg) { toast.textContent = msg; toast.classList.add("show"); clearTimeout(t); t = setTimeout(function () { toast.classList.remove("show"); }, 1800); }
  shareBtn.addEventListener("click", function () {
    var url = location.origin + location.pathname;
    if (navigator.share) {
      navigator.share({ title: "Sleeping Expert", text: "Sleeping Expert — nuorodos", url: url }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () { showToast("Nuoroda nukopijuota"); }, function () { showToast(url); });
    } else { prompt("Nuoroda:", url); }
  });

  // --- Struktūriniai duomenys -------------------------------------------------------
  var sameAs = Object.keys(C.social || {}).map(function (k) { return C.social[k]; }).filter(Boolean);
  document.getElementById("ldjson").textContent = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Sleeping Expert",
    "url": C.site,
    "email": C.email || undefined,
    "telephone": C.phone || undefined,
    "sameAs": sameAs
  });
})();
</script>
</body>
</html>
